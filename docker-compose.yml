services:

  kafka:
    image: apache/kafka:4.0.0
    container_name: job-kafka
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/tmp/kafka-logs
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: LvvFS4gHn91ZvLPxhY2hnw

      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      
  postgres:
    image: postgres:18.4
    container_name: job-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: job_market
    volumes:
      - postgres-data:/var/lib/postgresql

  spark:
    image: apache/spark:4.2.0
    container_name: job-spark
    depends_on:
      - kafka
      - postgres
    environment:
      HOME: /tmp
      IVY_HOME: /tmp/.ivy2
    volumes:
      - ./spark_kafka.py:/opt/spark-apps/spark_kafka.py:ro
    command: >
      /bin/sh -c "pip install --no-cache-dir psycopg2-binary &&
      /opt/spark/bin/spark-submit
      --master local[*]
      --conf spark.jars.ivy=/tmp/.ivy2
      --packages org.apache.spark:spark-sql-kafka-0-10_2.13:4.2.0,org.postgresql:postgresql:42.7.7
      /opt/spark-apps/spark_kafka.py"

  airflow:
    image: apache/airflow:3.3.0
    container_name: job-airflow
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:admin123@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: "H6zLLZyIqwRPguRSFkuqdHsdIdGHiAjbmsm0zjJB-WE="
      AIRFLOW__WEBSERVER__SECRET_KEY: "344d0f4a9334ad69a9032bc7a2ae4e3961ad52358764a1f8a6d7075232cfaad3"
      AIRFLOW_CONN_JOB_MARKET_DB: "postgres://postgres:admin123@postgres:5432/job_market"
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
    command: standalone

volumes:
  kafka-data:

  postgres-data:
    external: true

  airflow-logs: